<form [formGroup]="orderForm" (ngSubmit)="onSubmit()">
    <div class="p-fluid p-formgrid p-grid">
      <div class="p-field p-col-12">
        <label for="service">Услуга</label>
        <p-dropdown id="service" formControlName="service" [options]="services" optionLabel="name" placeholder="Выберите услугу"></p-dropdown>
      </div>
  
      <div class="p-field p-col-12">
        <label for="date">Дата</label>
        <p-calendar id="date" formControlName="date" [minDate]="minDate" dateFormat="dd.mm.yy"></p-calendar>
      </div>
  
      <div class="p-field p-col-12">
        <label for="time">Время</label>
        <p-dropdown id="time" formControlName="time" [options]="timeOptions" placeholder="Выберите время"></p-dropdown>
      </div>
  
      <div class="p-field p-col-12">
        <label for="address">Адрес проведения работ</label>
        <input id="address" type="text" pInputText formControlName="address" placeholder="Введите адрес" />
      </div>
    </div>
  
    <div class="p-d-flex p-jc-end p-mt-4">
      <p-button label="Отмена" class="p-button-text" (click)="close()"></p-button>
      <p-button label="Отправить" type="submit" [disabled]="orderForm.invalid" class="p-ml-2"></p-button>
    </div>
  </form>

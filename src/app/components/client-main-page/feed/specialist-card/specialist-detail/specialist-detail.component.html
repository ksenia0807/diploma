<div class="p-m-3" *ngIf="specialist">
    <!-- Карусель фотографий -->
    <p-galleria 
      [value]="specialist.photos"
      [showThumbnails]="true"
      [circular]="true"
      [numVisible]="3"
      [showItemNavigators]="true"
      [showIndicators]="true"
      [containerStyle]="{ 'max-width': '600px', 'margin': '0 auto' }"
    >
      <ng-template pTemplate="item" let-item>
        <img [src]="item" alt="Фото специалиста" style="width: 100%; height: 400px; object-fit: cover;" />
      </ng-template>
      <ng-template pTemplate="thumbnail" let-item>
        <img [src]="item" alt="Миниатюра" style="width: 80px; height: 60px; object-fit: cover;" />
      </ng-template>
    </p-galleria>
  
    <!-- Информация о специалисте -->
    <div class="p-mt-4">
      <h2>{{ specialist.title }}</h2>
      <p>{{ specialist.fullDescription }}</p>
  
      <div class="flex align-items-center p-mb-3">
        <i class="pi pi-map-marker p-mr-2"></i>
        <span><strong>Область работы:</strong> {{ specialist.location }}</span>
      </div>
  
      <div>
        <h3>Цены на услуги</h3>
        <ul class="p-pl-3">
          <li *ngFor="let service of specialist.services">
            {{ service.name }} - <strong>{{ service.price | number }} ₽</strong>
          </li>
        </ul>
      </div>
    </div>
  </div>

<div class="specialist-card flex cursor-pointer"
     (click)="openCard(specialist)"
     *ngFor="let specialist of specialists">
    <img class="pic" [src]="specialist.photos[0]" width="100" height="100"/>
    <div class="flex flex-column gap-1">
        <div class="flex flex-row gap-3 align-items-center">
            <div class="title">{{ specialist.title }}</div>
            <div class="rating gap-1">
                {{ specialist.rating }}
                <i class="pi pi-star"></i>
            </div>
        </div>
        <div class="description">
            {{ specialist.shortDescription }}
        </div>
    </div>
</div>

<!-- Диалог подробной информации -->
<p-dialog header="Информация о специалисте"
          [(visible)]="dialogVisible"
          [modal]="true"
          [style]="{width: '600px'}"
          [contentStyle]="{'overflow':'visible'}"
          (onHide)="selectedSpecialist = null">
    <app-specialist-detail
        *ngIf="selectedSpecialist"
        [specialist]="selectedSpecialist">
    </app-specialist-detail>
</p-dialog>

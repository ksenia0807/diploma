<div class="specialist-card flex cursor-pointer"
     *ngFor="let specialist of specialists"
     (click)="openCard(specialist)">
  <img class="pic" [src]="specialist.photos[0]" width="100" height="100" />
  <div class="flex flex-column gap-1 p-ml-3">
    <div class="flex flex-row gap-3 align-items-center">
      <div class="title">{{ specialist.title }}</div>
      <div class="rating gap-1">
        {{ specialist.rating }}
        <i class="pi pi-star"></i>
      </div>
    </div>
    <div class="description">
      {{ specialist.fullDescription | slice:0:100 }}...
    </div>
  </div>
</div>

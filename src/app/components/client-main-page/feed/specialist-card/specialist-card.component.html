<div class="feed">
  <div class="specialist-card flex cursor-pointer"
     *ngFor="let service of services"
     (click)="openCard(service)">
    <img class="pic" [src]="service.photos[0]" width="160px" height="100%" />
    <div  *ngIf="service.specialist" class="flex flex-column gap-1">
      <div class="flex flex-row gap-3 align-items-center">
        <div class="title">{{ service.title }}</div>
        <div class="rating gap-1">
          {{ service.specialist.rating  }}
          <i class="pi pi-star"></i>
        </div>
      </div>
      <div class="description">
        {{ service.specialist.about }}
      </div>
    </div>
  </div>
</div>

<div *ngIf="specialist" class="surface-card p-4 shadow-2 border-round-xl w-6 mx-auto mt-5">
  <div class="flex align-items-center gap-4 mb-4">
    <img [src]="specialist.avatar[0]" class="border-circle" style="width: 96px; height: 96px; object-fit: cover;">
    <div>
      <div class="text-2xl font-bold mb-1">{{ specialist.surname }} {{ specialist.name }} {{ specialist.patronymic }}</div>
      <div class="text-xl">Отзывы</div>
    </div>
  </div>

  <div *ngIf="reviews.length > 0; else noReviews">
    <p-card *ngFor="let review of reviews" class="mb-3">
      <div class="flex align-items-center gap-3 mb-2">
        <div class="text-lg font-bold">{{ review.login }}</div>
        <div class="flex">
          <i *ngFor="let star of [1,2,3,4,5]" 
              class="pi" 
              [ngClass]="star <= review.rating ? 'pi-star-fill' : 'pi-star'"></i>
        </div>
      </div>
      <p>{{ review.comment }}</p>
      <div class="text-color-secondary text-sm">{{ review.date | date:'dd.MM.yyyy' }}</div>
    </p-card>
  </div>

  <ng-template #noReviews>
    <p-card class="text-center">
      Пока нет отзывов о данном специалисте
    </p-card>
  </ng-template>
</div>

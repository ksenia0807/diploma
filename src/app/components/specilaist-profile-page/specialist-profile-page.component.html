<div *ngIf="specialist" class="surface-card p-4 shadow-2 border-round-xl max-w-30rem mx-auto mt-5">
  <!-- Профиль пользователя -->
  <div class="flex align-items-center gap-4 mb-4">
    <img [src]="specialist.avatar[0]" alt="Аватар" class="border-circle" style="width: 96px; height: 96px; object-fit: cover;">
    <div>
      <div class="text-2xl font-bold mb-1">{{ specialist.surname }} {{ specialist.name }} {{ specialist.patronymic }}</div>
      <div class="flex align-items-center text-color-secondary">
        <i class="pi pi-map-marker text-primary mr-2"></i>
        <span>{{ specialist.location }}</span>
      </div>
    </div>
  </div>

</div>

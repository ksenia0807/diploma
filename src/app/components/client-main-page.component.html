<div class="flex flex-column gap-5">
    <div class="search flex justify-content-center justify-self-center">
        <p-dropdown 
            [options]="services" 
            [(ngModel)]="selectedService" 
            placeholder="Какую услугу ищите?" 
            [editable]="true" 
            optionLabel="name"
            dropdownIcon="pi pi-search">
        </p-dropdown>
    </div>
    
    <div class="justify-self-center flex justify-content-center gap-3">
        <p-floatLabel>
            <p-dropdown
            [options]="Cityfilters" 
            [(ngModel)]="selectedCity" 
            inputId="float-label"
            optionLabel="name" 
            [filter]="true"
            [showClear]="true" />
            <label for="float-label">Город</label>
        </p-floatLabel>

        <div>
        <p-floatLabel>
            <p-dropdown 
            [(ngModel)]="priceRange" 
            [options]="priceOptions" 
            inputId="float-label"
            (onChange)="onPriceChange()">
                <ng-template pTemplate="selectedItem">
                    <span *ngIf="priceRange !== 'custom'">
                      {{ getSelectedLabel() }}
                    </span>
                    <span *ngIf="priceRange === 'custom'">
                      {{ selectedRange[0] }} - {{ selectedRange[1] }} ₽
                    </span>
                </ng-template>

                <ng-template pTemplate="dropdownicon">
                  <i class="pi pi-sliders-h"></i>
                </ng-template>
            </p-dropdown>
            <label for="float-label">Цена</label>
        </p-floatLabel>
          
        <p-dialog 
        [(visible)]="showSlider" 
        [modal]="true" [style]="{ width: '400px' }" 
        header="Выбор диапазона">
            <div class="slider-container flex flex-column gap-3">
              <p-slider [(ngModel)]="selectedRange" [range]="true" [min]="0" [max]="100000" />

              <div class="flex justify-content-between">
                <span>От: {{ selectedRange[0] }}</span>
                <span>До: {{ selectedRange[1] }}</span>
              </div>

              <p-button label="Применить" (click)="applyRange()"></p-button>
            </div>
        </p-dialog>
        </div>
        
        <p-floatLabel>
            <p-dropdown
            [options]="ratingOptions" 
            [(ngModel)]="ratingOption" 
            inputId="float-label"
            optionLabel="label" 
            [showClear]="true" />
            <label for="float-label">Рейтинг</label>
        </p-floatLabel>

    </div>
</div>

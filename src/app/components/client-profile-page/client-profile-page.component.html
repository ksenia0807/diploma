<div *ngIf="client" class="surface-card p-4 shadow-2 border-round-xl w-6 mx-auto mt-5">
  <div class="flex justify-content-between">
    <div class="flex align-items-center justify-content-between gap-4 mb-4">
      <img [src]="client.avatar[0]" class="border-circle" style="width: 96px; height: 96px; object-fit: cover;">
      <div>
        <div class="text-2xl font-bold mb-1">{{ client.login }}</div>
        <div class="flex flex-column align-items-center text-color-secondary">
          <div><i class="pi pi-envelope text-primary mr-2"></i>
          <span>{{ client.email }}</span></div>
          <div><i class="pi pi-phone text-primary mr-2"></i>
          <span>{{ client.phone }}</span></div>
        </div>
      </div>
    </div>
    
    <div class="flex flex-row gap-3">
      <p class="logout">Выйти</p>
      <p-button 
      icon="pi pi-sign-out" 
      class="logoutbutton"
      (click)="logout()"
      pTooltip="Выйти из аккаунта"
      tooltipPosition="bottom">
      </p-button>
    </div>
  </div>

  <div>
    <h3 class="mb-3">История заявок</h3>
    <p-table 
      [value]="clientOrders" 
      responsiveLayout="scroll"
      (onRowSelect)="onRowSelect($event.data)"
      selectionMode="single">
      <ng-template pTemplate="header">
        <tr>
          <th>Дата</th>
          <th>Услуга</th>
          <th>Цена</th>
          <th>Статус</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-order>
        <tr [pSelectableRow]="order" [class.cursor-pointer]="order.status === 'completed'">
          <td>{{ order.date }}</td>
          <td>{{ order.title }}</td>
          <td>{{ order.price | number }} ₽</td>
          <td>
            <span 
              class="font-bold"
              [ngClass]="{
                'completed': order.status === 'completed',
                'inprogress': order.status === 'inprogress',
                'canceled': order.status === 'canceled',
                'new': order.status === 'new'
              }">
              {{ getStatusLabel(order.status) }}
            </span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [modal]="true" [(visible)]="displayReviewDialog" header="Оставить отзыв" [style]="{width: '50vw'}">
  <div class="flex flex-column gap-3">
    <div>
      <label class="block mb-2">Оценка:</label>
      <p-rating [(ngModel)]="newReview.rating" [cancel]="false"></p-rating>
    </div>
    
    <div>
      <label class="block mb-2">Комментарий:</label>
      <textarea 
        pInputTextarea 
        [(ngModel)]="newReview.comment" 
        rows="5" 
        style="width: 100%"></textarea>
    </div>
  </div>
  
  <ng-template pTemplate="footer">
    <p-button label="Отмена" icon="pi pi-times" (click)="displayReviewDialog = false"></p-button>
    <p-button 
      label="Отправить" 
      icon="pi pi-check" 
      (click)="submitReview()"
      [disabled]="newReview.rating === 0 || !newReview.comment"></p-button>
  </ng-template>
</p-dialog>

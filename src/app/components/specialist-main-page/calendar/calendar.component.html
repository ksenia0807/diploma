<div class="calendar-container">
    <p-calendar 
    class="max-w-full" 
    [(ngModel)]="selectedDate"
    [inline]="true" 
    [showWeek]="true" 
    (onSelect)="onDateSelect($event)"/>

    <p-scrollPanel [style]="{ width: '100%', height: '235px' }" class="orders-panel">
        <div *ngIf="currentOrder; else noOrders">
            <p-card [style]="{ width: '100%', 'margin-bottom': '1rem' }" 
                   [ngClass]="currentOrder.status">
                <ng-template pTemplate="header">
                    <div class="order-header">
                        <h2>{{ currentOrder.title }}</h2>
                    </div>
                </ng-template>
                <p>{{ description }}</p>
                
            </p-card>
        </div>
        
        <ng-template #noOrders>
            <div *ngIf="selectedDate" class="p-3 text-center">
                <p>На выбранную дату заказов нет</p>
            </div>
        </ng-template>
    </p-scrollPanel>
</div>
